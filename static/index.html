<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f8;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: #243447;
            color: white;
            padding: 25px;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 40px 15px;
        }

        .card {
            background-color: white;
            width: 250px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        h2 {
            color: #243447;
        }

        p {
            color: #555;
        }

        a {
            display: inline-block;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            margin-top: 10px;
        }

        a:hover {
            background-color: #0056b3;
        }

        footer {
            margin-top: 40px;
            padding: 15px;
            background-color: #243447;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>Management System</h1>
        <p style="color: white;">Manage Your Products, Clients and Orders</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>Products</h2>
            <p>Add, view, update and delete products.</p>
            <a href="http://127.0.0.1:8000/products/" target="_blank">
                Manage Products
            </a>
        </div>

        <div class="card">
            <h2>Clients</h2>
            <p>Add, view, update and delete clients.</p>
            <a href="http://127.0.0.1:8000/clients/" target="_blank">
                Manage Clients
            </a>
        </div>

        <div class="card">
            <h2>Orders</h2>
            <p>Create, view, update and delete orders.</p>
            <a href="http://127.0.0.1:8000/orders/" target="_blank">
                Manage Orders
            </a>
        </div>

    </div>

    <footer>
        <p style="color: white;">Product, Client & Order Management System</p>
    </footer>

</body>
</html>
